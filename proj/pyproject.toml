[build-system]
requires = ["uv_build<0.11"]
build-backend = "uv_build"

[project]
name = "eadd"
version = "0.1.0"
description = "Explainable audio deepfake detection"
requires-python = ">=3.13"
#readme = "README.md"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.6.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ruff>=0.15.9",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.3",
    "soundfile>=0.14.0",
    "statsmodels>=0.14.6",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchcodec>=0.10.0",
    "transformers>=5.3.0",
    "ty>=0.0.29",
]

[tool.ruff]
line-length = 120
